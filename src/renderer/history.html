<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call History - Copilot Tasks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .tabs {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #a0aec0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tab:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .tab.active {
      background: rgba(102, 126, 234, 0.2);
      color: #a3bffa;
    }
    
    .content {
      padding: 24px;
    }
    
    .call-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .call-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .call-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .call-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    
    .call-topic {
      font-size: 15px;
      font-weight: 500;
    }
    
    .call-status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    
    .call-status.completed {
      background: rgba(72, 187, 120, 0.2);
      color: #48bb78;
    }
    
    .call-status.denied {
      background: rgba(252, 129, 129, 0.2);
      color: #fc8181;
    }
    
    .call-status.pending {
      background: rgba(237, 137, 54, 0.2);
      color: #ed8936;
    }
    
    .call-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #718096;
    }
    
    .call-summary {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #a0aec0;
      line-height: 1.5;
    }
    
    .empty-state {
      text-align: center;
      padding: 48px;
      color: #718096;
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    /* Queue section */
    .queue-item {
      background: rgba(237, 137, 54, 0.1);
      border: 1px solid rgba(237, 137, 54, 0.2);
    }
    
    .queue-item .call-topic::before {
      content: '📞 ';
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Copilot Tasks</h1>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="history">History</button>
    <button class="tab" data-tab="queue">Queue <span id="queue-count"></span></button>
  </div>
  
  <div class="content">
    <div id="history-tab" class="tab-content">
      <div class="call-list" id="history-list">
        <!-- Populated by JS -->
      </div>
    </div>
    
    <div id="queue-tab" class="tab-content hidden">
      <div class="call-list" id="queue-list">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-tab`).classList.remove('hidden');
      });
    });

    // Load history
    async function loadHistory() {
      const history = await window.copilotTasks.getHistory();
      const listEl = document.getElementById('history-list');
      
      if (history.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <p>No call history yet</p>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = history.map(call => `
        <div class="call-item" data-call-id="${call.callId}">
          <div class="call-item-header">
            <div class="call-topic">${escapeHtml(call.topic)}</div>
            <div class="call-status ${call.status}">${call.status}</div>
          </div>
          <div class="call-meta">
            <span>${formatDate(call.createdAt)}</span>
            ${call.result?.duration ? `<span>${formatDuration(call.result.duration)}</span>` : ''}
          </div>
          ${call.result?.summary ? `
            <div class="call-summary">${escapeHtml(call.result.summary)}</div>
          ` : ''}
        </div>
      `).join('');
    }

    // Load queue
    async function loadQueue() {
      const queue = await window.copilotTasks.getQueue();
      const listEl = document.getElementById('queue-list');
      const countEl = document.getElementById('queue-count');
      
      countEl.textContent = queue.length > 0 ? `(${queue.length})` : '';
      
      if (queue.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <p>No calls in queue</p>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = queue.map((call, index) => `
        <div class="call-item queue-item">
          <div class="call-item-header">
            <div class="call-topic">${escapeHtml(call.topic)}</div>
            <div class="call-status pending">#${index + 1}</div>
          </div>
          <div class="call-meta">
            <span>Queued ${formatDate(call.timestamp)}</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleString();
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}m ${secs}s`;
    }

    // Initial load
    loadHistory();
    loadQueue();
    
    // Refresh periodically
    setInterval(() => {
      loadHistory();
      loadQueue();
    }, 5000);
  </script>
  
  <style>
    .hidden { display: none !important; }
  </style>
</body>
</html>
