<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Teams</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #464775;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    
    body {
      -webkit-app-region: drag;
    }
    
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Blurred purple gradient background like Teams */
      background: linear-gradient(135deg, #464775 0%, #5b5fc7 30%, #7579c2 60%, #8b8fc9 100%);
      position: relative;
    }
    
    /* Blur overlay effect */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(100, 100, 180, 0.4) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(80, 80, 150, 0.3) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }
    
    /* Avatar */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6264a7 0%, #8b8fc9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      margin-bottom: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    /* Caller Info */
    .caller-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    
    .call-status {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    
    /* Action Buttons - 3 circular buttons */
    .actions {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      -webkit-app-region: no-drag;
    }
    
    .btn-round {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 20px;
    }
    
    .btn-round:hover {
      transform: scale(1.1);
    }
    
    .btn-round:active {
      transform: scale(0.95);
    }
    
    .btn-video {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(10px);
    }
    
    .btn-audio {
      background: #5b5fc7;
      color: white;
      box-shadow: 0 4px 15px rgba(91, 95, 199, 0.5);
    }
    
    .btn-decline {
      background: #c4314b;
      color: white;
      box-shadow: 0 4px 15px rgba(196, 49, 75, 0.5);
    }
    
    /* SVG icons */
    .btn-round svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="avatar" id="avatar">✦</div>
      
      <div class="caller-name" id="callerName">Copilot</div>
      <div class="call-status">is calling you</div>
    </div>
    
    <div class="actions">
      <!-- Video button -->
      <button class="btn-round btn-video" id="btnVideo" title="Accept with video">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      
      <!-- Audio accept button -->
      <button class="btn-round btn-audio" id="btnAccept" title="Accept with audio">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      
      <!-- Decline button -->
      <button class="btn-round btn-decline" id="btnDecline" title="Decline">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const callerName = urlParams.get('name') || 'Copilot';
    
    document.getElementById('callerName').textContent = callerName;
    
    // Use sparkle for Copilot, otherwise first letter
    if (callerName.toLowerCase() === 'copilot') {
      document.getElementById('avatar').textContent = '✦';
    } else {
      document.getElementById('avatar').textContent = callerName.charAt(0).toUpperCase();
    }
    
    document.getElementById('btnDecline').addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.declineSimulatedCall('teams');
      } else {
        window.close();
      }
    });
    
    const acceptCall = () => {
      if (window.electronAPI) {
        window.electronAPI.acceptSimulatedCall('teams', callerName);
      } else {
        console.log(JSON.stringify({ accepted: true, platform: 'teams', callerName }));
        window.close();
      }
    };
    
    document.getElementById('btnAccept').addEventListener('click', acceptCall);
    document.getElementById('btnVideo').addEventListener('click', acceptCall);
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'Enter') {
        acceptCall();
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'Escape') {
        document.getElementById('btnDecline').click();
      }
    });
  </script>
</body>
</html>
