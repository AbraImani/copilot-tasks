<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Teams</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #292929;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    
    body {
      -webkit-app-region: drag;
    }
    
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #292929 0%, #1f1f1f 100%);
    }
    
    /* Teams Header */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #5b5fc7;
    }
    
    .teams-logo {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }
    
    .header-text {
      font-size: 13px;
      font-weight: 600;
    }
    
    /* Main Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .call-type {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }
    
    /* Avatar */
    .avatar-container {
      position: relative;
      margin-bottom: 20px;
    }
    
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b5fc7 0%, #7b7fda 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
    }
    
    .avatar-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      border: 3px solid rgba(91, 95, 199, 0.5);
      animation: ring-pulse 2s ease-in-out infinite;
    }
    
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.3; }
    }
    
    /* Caller Info */
    .caller-name {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .caller-context {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }
    
    .call-status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #5b5fc7;
      border-radius: 50%;
      animation: blink 1s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Action Buttons */
    .actions {
      display: flex;
      gap: 16px;
      margin-top: auto;
      padding: 24px;
      -webkit-app-region: no-drag;
    }
    
    .btn {
      flex: 1;
      height: 44px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    
    .btn:hover {
      filter: brightness(1.1);
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-decline {
      background: #c42b1c;
      color: white;
    }
    
    .btn-accept {
      background: #5b5fc7;
      color: white;
    }
    
    .btn-accept-video {
      background: #5b5fc7;
      color: white;
    }
    
    .btn-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="teams-logo" viewBox="0 0 24 24" fill="white">
        <path d="M20.625 8.5h-6.25a.625.625 0 0 0-.625.625v6.25c0 .345.28.625.625.625h6.25c.345 0 .625-.28.625-.625v-6.25a.625.625 0 0 0-.625-.625zM17.5 6.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-.625 2h-7.75A.625.625 0 0 0 3 9.625v7.75c0 .345.28.625.625.625h7.75c.345 0 .625-.28.625-.625v-7.75A.625.625 0 0 0 11.375 9z"/>
      </svg>
      <span class="header-text">Microsoft Teams</span>
    </div>
    
    <div class="content">
      <div class="call-type" id="callType">Incoming video call</div>
      
      <div class="avatar-container">
        <div class="avatar-ring"></div>
        <div class="avatar" id="avatar">S</div>
      </div>
      
      <div class="caller-name" id="callerName">Sarah Chen</div>
      <div class="caller-context" id="callerContext">Engineering standup</div>
      
      <div class="call-status">
        <span class="status-dot"></span>
        <span>Calling...</span>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-decline" id="btnDecline">
        <span class="btn-icon">✕</span>
        Decline
      </button>
      <button class="btn btn-accept-video" id="btnAccept">
        <span class="btn-icon">📹</span>
        Accept
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const callerName = urlParams.get('name') || 'Unknown';
    const callerContext = urlParams.get('context') || '';
    const callType = urlParams.get('type') || 'video';
    
    document.getElementById('callerName').textContent = callerName;
    document.getElementById('callerContext').textContent = callerContext;
    document.getElementById('avatar').textContent = callerName.charAt(0).toUpperCase();
    document.getElementById('callType').textContent = `Incoming ${callType} call`;
    
    if (callType === 'audio') {
      document.getElementById('btnAccept').innerHTML = '<span class="btn-icon">📞</span> Accept';
    }
    
    document.getElementById('btnDecline').addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.declineSimulatedCall('teams');
      } else {
        window.close();
      }
    });
    
    document.getElementById('btnAccept').addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.acceptSimulatedCall('teams', callerName);
      } else {
        console.log(JSON.stringify({ accepted: true, platform: 'teams', callerName }));
        window.close();
      }
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'Enter') {
        document.getElementById('btnAccept').click();
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'Escape') {
        document.getElementById('btnDecline').click();
      }
    });
  </script>
</body>
</html>
