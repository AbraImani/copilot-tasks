<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Call</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    
    .container {
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    .caller-info h2 {
      font-size: 16px;
      font-weight: 600;
      color: #a0aec0;
    }
    
    .caller-info p {
      font-size: 12px;
      color: #718096;
      margin-top: 2px;
    }
    
    .topic {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      flex: 1;
    }
    
    .topic-label {
      font-size: 11px;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .topic-text {
      font-size: 15px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    
    .questions {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 12px;
    }
    
    .questions ul {
      margin-top: 4px;
      padding-left: 16px;
    }
    
    .questions li {
      margin: 2px 0;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      -webkit-app-region: no-drag;
    }
    
    .btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-accept {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
    }
    
    .btn-accept:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
    }
    
    .btn-deny {
      background: rgba(255, 255, 255, 0.1);
      color: #fc8181;
      border: 1px solid rgba(252, 129, 129, 0.3);
    }
    
    .btn-deny:hover {
      background: rgba(252, 129, 129, 0.2);
    }
    
    /* Active call state */
    .call-active .header .avatar {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      animation: none;
    }
    
    .call-active .actions {
      justify-content: center;
    }
    
    .btn-end {
      background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
      color: white;
      max-width: 200px;
    }
    
    .transcript {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    .transcript-entry {
      margin: 4px 0;
      padding: 4px 8px;
      border-radius: 4px;
    }
    
    .transcript-entry.agent {
      background: rgba(102, 126, 234, 0.2);
      color: #a3bffa;
    }
    
    .transcript-entry.user {
      background: rgba(72, 187, 120, 0.2);
      color: #9ae6b4;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container" id="incoming-call">
    <div class="header">
      <div class="avatar">🤖</div>
      <div class="caller-info">
        <h2>Coding Agent is calling...</h2>
        <p>Voice assistance requested</p>
      </div>
    </div>
    
    <div class="topic">
      <div class="topic-label">Topic</div>
      <div class="topic-text" id="call-topic">Loading...</div>
      <div class="questions" id="call-questions"></div>
    </div>
    
    <div class="actions">
      <button class="btn btn-deny" id="btn-deny">Deny</button>
      <button class="btn btn-accept" id="btn-accept">Accept</button>
    </div>
  </div>
  
  <div class="container call-active hidden" id="active-call">
    <div class="header">
      <div class="avatar">🎙️</div>
      <div class="caller-info">
        <h2>On Call with Agent</h2>
        <p id="call-duration">00:00</p>
      </div>
    </div>
    
    <div class="topic">
      <div class="topic-label">Topic</div>
      <div class="topic-text" id="active-topic">Loading...</div>
    </div>
    
    <div class="transcript" id="transcript"></div>
    
    <div class="actions">
      <button class="btn btn-end" id="btn-end">End Call</button>
    </div>
  </div>

  <script>
    let currentCall = null;
    let callStartTime = null;
    let durationInterval = null;

    // Handle incoming call
    window.copilotTasks.onIncomingCall((call) => {
      currentCall = call;
      document.getElementById('call-topic').textContent = call.topic;
      
      if (call.questions && call.questions.length > 0) {
        const questionsHtml = '<ul>' + 
          call.questions.map(q => `<li>${q}</li>`).join('') + 
          '</ul>';
        document.getElementById('call-questions').innerHTML = questionsHtml;
      }
    });

    // Handle call started
    window.copilotTasks.onCallStarted(async (callId) => {
      document.getElementById('incoming-call').classList.add('hidden');
      document.getElementById('active-call').classList.remove('hidden');
      document.getElementById('active-topic').textContent = currentCall.topic;
      
      callStartTime = Date.now();
      durationInterval = setInterval(updateDuration, 1000);
      
      // Start voice session
      window.copilotTasks.startVoiceSession(
        currentCall.callId,
        currentCall.context,
        currentCall.questions
      );
      
      // Start microphone capture
      await startMicrophoneCapture();
    });

    // Microphone capture
    let mediaStream = null;
    let audioWorklet = null;
    let micAudioContext = null;

    async function startMicrophoneCapture() {
      try {
        console.log('🎤 Requesting microphone access...');
        
        // Request microphone access
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            sampleRate: 16000,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
          } 
        });
        
        console.log('✅ Microphone access granted');
        
        // Create audio context for processing
        micAudioContext = new AudioContext({ sampleRate: 16000 });
        const source = micAudioContext.createMediaStreamSource(mediaStream);
        
        // Use ScriptProcessor for simplicity (AudioWorklet would be better for production)
        const processor = micAudioContext.createScriptProcessor(4096, 1, 1);
        
        processor.onaudioprocess = (e) => {
          const inputData = e.inputBuffer.getChannelData(0);
          
          // Convert float32 to int16 PCM
          const pcm16 = new Int16Array(inputData.length);
          for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          
          // Convert to base64
          const bytes = new Uint8Array(pcm16.buffer);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          const base64Audio = btoa(binary);
          
          // Send to main process
          if (currentCall) {
            window.copilotTasks.sendVoiceAudio(currentCall.callId, base64Audio);
          }
        };
        
        source.connect(processor);
        processor.connect(micAudioContext.destination);
        
        console.log('🎙️ Microphone streaming started');
        
      } catch (error) {
        console.error('❌ Microphone error:', error);
        alert('Microphone access is required for voice calls. Please allow microphone access and try again.');
      }
    }

    function stopMicrophoneCapture() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (micAudioContext) {
        micAudioContext.close();
        micAudioContext = null;
      }
      console.log('🎤 Microphone stopped');
    }

    // Accept button
    document.getElementById('btn-accept').addEventListener('click', () => {
      if (currentCall) {
        window.copilotTasks.acceptCall(currentCall.callId);
      }
    });

    // Deny button
    document.getElementById('btn-deny').addEventListener('click', () => {
      if (currentCall) {
        window.copilotTasks.denyCall(currentCall.callId);
      }
    });

    // End call button
    document.getElementById('btn-end').addEventListener('click', () => {
      if (currentCall) {
        stopMicrophoneCapture();
        const result = {
          summary: 'Call ended by user',
          duration: Math.round((Date.now() - callStartTime) / 1000),
        };
        window.copilotTasks.endCall(currentCall.callId, result);
        clearInterval(durationInterval);
      }
    });

    function updateDuration() {
      if (!callStartTime) return;
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('call-duration').textContent = `${mins}:${secs}`;
    }

    // Audio playback queue
    let audioContext = null;
    let audioQueue = [];
    let isPlaying = false;

    async function playAudioChunk(base64Audio) {
      if (!audioContext) {
        audioContext = new AudioContext();
      }
      
      try {
        // Decode base64 to array buffer
        const binaryString = atob(base64Audio);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        
        // Decode audio data
        const audioBuffer = await audioContext.decodeAudioData(bytes.buffer);
        
        // Play it
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);
        source.start();
        
        return new Promise(resolve => {
          source.onended = resolve;
        });
      } catch (e) {
        console.error('Audio playback error:', e);
      }
    }

    async function processAudioQueue() {
      if (isPlaying || audioQueue.length === 0) return;
      
      isPlaying = true;
      while (audioQueue.length > 0) {
        const chunk = audioQueue.shift();
        await playAudioChunk(chunk);
      }
      isPlaying = false;
    }

    // Listen for audio from Eleven Labs
    window.copilotTasks.onVoiceAudio((data) => {
      if (data.audio) {
        audioQueue.push(data.audio);
        processAudioQueue();
      }
    });

    // Listen for transcript updates
    window.copilotTasks.onVoiceTranscript((entry) => {
      const transcriptDiv = document.getElementById('transcript');
      const entryDiv = document.createElement('div');
      entryDiv.className = `transcript-entry ${entry.role}`;
      entryDiv.textContent = `${entry.role === 'agent' ? '🤖' : '👤'} ${entry.text}`;
      transcriptDiv.appendChild(entryDiv);
      transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
    });

    // Listen for call complete
    window.copilotTasks.onVoiceComplete((data) => {
      console.log('Voice call complete:', data);
      // Could auto-end the call here
    });
  </script>
</body>
</html>
