<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Call</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      margin: 0;
      padding: 0;
    }
    
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 28px;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }
    
    /* Avatar / Logo */
    .avatar-container {
      position: relative;
      margin-bottom: 16px;
    }
    
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 0 0 3px rgba(255, 255, 255, 0.1),
        0 8px 32px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    
    .avatar img {
      width: 60px;
      height: 60px;
    }
    
    .avatar-ring {
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 50%;
      border: 2px solid rgba(52, 199, 89, 0.6);
      animation: ring-pulse 2s ease-in-out infinite;
    }
    
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.2; }
    }
    
    /* Caller Info */
    .caller-info {
      text-align: center;
      margin-bottom: 8px;
    }
    
    .caller-name {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    
    .caller-status {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }
    
    /* Question Card */
    .question-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
      flex: 1;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    .question-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    
    .question-text {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .questions-list {
      margin-top: 12px;
      padding: 0;
      list-style: none;
    }
    
    .questions-list li {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 0;
      padding-left: 16px;
      position: relative;
    }
    
    .questions-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: rgba(52, 199, 89, 0.8);
    }
    
    /* Call Actions */
    .actions {
      display: flex;
      gap: 40px;
      -webkit-app-region: no-drag;
      margin-top: auto;
      padding-top: 8px;
    }
    
    .btn-round {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 28px;
    }
    
    .btn-round:hover {
      transform: scale(1.1);
    }
    
    .btn-round:active {
      transform: scale(0.95);
    }
    
    .btn-deny {
      background: #ff3b30;
      box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
    }
    
    .btn-accept {
      background: #34c759;
      box-shadow: 0 4px 20px rgba(52, 199, 89, 0.4);
    }
    
    /* Active Call State */
    .call-active .avatar-container {
      margin-bottom: 8px;
    }
    
    .call-active .avatar {
      width: 72px;
      height: 72px;
    }
    
    .call-active .avatar img {
      width: 44px;
      height: 44px;
    }
    
    .call-active .avatar-ring {
      border-color: rgba(52, 199, 89, 0.8);
      animation: none;
    }
    
    .call-active .caller-info {
      margin-bottom: 4px;
    }
    
    .call-active .caller-name {
      font-size: 20px;
    }
    
    .topic-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    .topic-card.hidden {
      display: none;
    }
    
    .transcript {
      width: 100%;
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 12px;
      min-height: 120px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    .transcript-entry {
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
    }
    
    .transcript-entry.agent {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      margin-right: auto;
    }
    
    .transcript-entry.user {
      background: rgba(52, 199, 89, 0.3);
      color: rgba(255, 255, 255, 0.95);
      margin-left: auto;
    }
    
    .text-input-container {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      -webkit-app-region: no-drag;
    }
    
    .text-input-container.hidden {
      display: none;
    }
    
    .text-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 14px;
      outline: none;
    }
    
    .text-input:focus {
      border-color: rgba(52, 199, 89, 0.5);
    }
    
    .text-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .btn-send {
      padding: 12px 20px;
      background: #34c759;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    
    .btn-send:hover {
      background: #2db84e;
    }
    
    .active-actions {
      display: flex;
      gap: 20px;
      -webkit-app-region: no-drag;
    }
    
    .btn-action {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.15);
    }
    
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    
    .btn-action.active {
      background: #34c759;
    }
    
    .btn-end-call {
      background: #ff3b30;
      box-shadow: 0 4px 16px rgba(255, 59, 48, 0.3);
    }
    
    .btn-end-call:hover {
      background: #e6342b;
    }
    
    .call-duration {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    <div class="caller-info">
      <div class="caller-name">Copilot Agent</div>
      <div class="call-duration" id="call-duration">00:00</div>
    </div>
    
    <div class="topic-card" id="topic-card">
      <div class="question-label">Topic</div>
      <div class="question-text" id="active-topic"></div>
    </div>
    
    <div class="transcript" id="transcript"></div>
    
    <div class="text-input-container hidden" id="text-input-container">
      <input type="text" class="text-input" id="text-input" placeholder="Type a message..." />
      <button class="btn btn-send" id="btn-send">Send</button>
    </div>
    
    <div class="active-actions">
      <button class="btn-action" id="btn-toggle-text" title="Type message">⌨️</button>
      <button class="btn-action btn-end-call" id="btn-end" title="End call">✕</button>
    </div>
  </div>

  <script>
    let currentCall = null;
    let callStartTime = null;
    let durationInterval = null;

    // Handle incoming call
    window.copilotTasks.onIncomingCall((call) => {
      currentCall = call;
      document.getElementById('call-topic').textContent = call.topic;
      
      const questionsEl = document.getElementById('call-questions');
      if (call.questions && call.questions.length > 0) {
        questionsEl.innerHTML = call.questions.map(q => `<li>${q}</li>`).join('');
        questionsEl.style.display = 'block';
      } else {
        questionsEl.style.display = 'none';
      }
    });

    // Handle call started
    window.copilotTasks.onCallStarted(async (callId) => {
      document.getElementById('incoming-call').classList.add('hidden');
      document.getElementById('active-call').classList.remove('hidden');
      
      // Only show topic card if topic is provided
      const topicCard = document.getElementById('topic-card');
      if (currentCall.topic && currentCall.topic.trim()) {
        document.getElementById('active-topic').textContent = currentCall.topic;
        topicCard.classList.remove('hidden');
      } else {
        topicCard.classList.add('hidden');
      }
      
      callStartTime = Date.now();
      durationInterval = setInterval(updateDuration, 1000);
      
      // Start voice session
      window.copilotTasks.startVoiceSession(
        currentCall.callId,
        currentCall.context,
        currentCall.questions
      );
      
      // Start microphone capture
      await startMicrophoneCapture();
    });

    // Microphone capture
    let mediaStream = null;
    let audioWorklet = null;
    let micAudioContext = null;
    let audioChunkCount = 0;

    async function startMicrophoneCapture() {
      try {
        console.log('🎤 Requesting microphone access...');
        
        // Check if getUserMedia is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('getUserMedia not supported in this browser');
        }
        
        // Request microphone access
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            sampleRate: 16000,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
          } 
        });
        
        console.log('✅ Microphone access granted');
        console.log('   Tracks:', mediaStream.getAudioTracks().map(t => t.label).join(', '));
        
        // Create audio context for processing
        micAudioContext = new AudioContext({ sampleRate: 16000 });
        console.log('   AudioContext sample rate:', micAudioContext.sampleRate);
        
        const source = micAudioContext.createMediaStreamSource(mediaStream);
        
        // Use ScriptProcessor for simplicity (AudioWorklet would be better for production)
        const processor = micAudioContext.createScriptProcessor(4096, 1, 1);
        
        processor.onaudioprocess = (e) => {
          const inputData = e.inputBuffer.getChannelData(0);
          
          // Convert float32 to int16 PCM
          const pcm16 = new Int16Array(inputData.length);
          for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          
          // Convert to base64
          const bytes = new Uint8Array(pcm16.buffer);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          const base64Audio = btoa(binary);
          
          // Send to main process
          if (currentCall) {
            window.copilotTasks.sendVoiceAudio(currentCall.callId, base64Audio);
            audioChunkCount++;
            if (audioChunkCount % 50 === 0) {
              console.log(`📤 Sent ${audioChunkCount} audio chunks to Eleven Labs`);
            }
          }
        };
        
        source.connect(processor);
        processor.connect(micAudioContext.destination);
        
        console.log('🎙️ Microphone streaming started');
        
      } catch (error) {
        console.error('❌ Microphone error:', error);
        console.error('   Error name:', error.name);
        console.error('   Error message:', error.message);
        alert('Microphone access is required for voice calls. Error: ' + error.message);
      }
    }

    function stopMicrophoneCapture() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (micAudioContext) {
        micAudioContext.close().catch(() => {});
        micAudioContext = null;
      }
      console.log('🎤 Microphone stopped');
    }
    
    function stopAudioPlayback() {
      audioQueue = [];
      isPlaying = false;
      if (playbackAudioContext) {
        playbackAudioContext.close().catch(() => {});
        playbackAudioContext = null;
      }
      console.log('🔊 Audio playback stopped');
    }

    // Accept button
    document.getElementById('btn-accept').addEventListener('click', () => {
      if (currentCall) {
        window.copilotTasks.acceptCall(currentCall.callId);
      }
    });

    // Deny button
    document.getElementById('btn-deny').addEventListener('click', () => {
      if (currentCall) {
        window.copilotTasks.denyCall(currentCall.callId);
      }
    });

    // End call button
    document.getElementById('btn-end').addEventListener('click', () => {
      if (currentCall) {
        stopMicrophoneCapture();
        stopAudioPlayback();
        const result = {
          summary: 'Call ended by user',
          duration: callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0,
        };
        window.copilotTasks.endCall(currentCall.callId, result);
        if (durationInterval) clearInterval(durationInterval);
      }
    });

    // Toggle text input
    let textInputVisible = false;
    document.getElementById('btn-toggle-text').addEventListener('click', () => {
      textInputVisible = !textInputVisible;
      document.getElementById('text-input-container').classList.toggle('hidden', !textInputVisible);
      document.getElementById('btn-toggle-text').classList.toggle('active', textInputVisible);
      
      // Mute/unmute mic when switching modes
      if (textInputVisible) {
        stopMicrophoneCapture();
        document.getElementById('text-input').focus();
      } else {
        startMicrophoneCapture();
      }
    });

    // Send text message
    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (text && currentCall) {
        window.copilotTasks.sendTextMessage(currentCall.callId, text);
        input.value = '';
      }
    }

    document.getElementById('btn-send').addEventListener('click', sendTextMessage);
    document.getElementById('text-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendTextMessage();
      }
    });

    function updateDuration() {
      if (!callStartTime) return;
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('call-duration').textContent = `${mins}:${secs}`;
    }

    // Audio playback for PCM 16-bit 16kHz mono
    let playbackAudioContext = null;
    let audioQueue = [];
    let isPlaying = false;
    const SAMPLE_RATE = 16000;

    function playPcmAudio(base64Audio) {
      if (!playbackAudioContext || playbackAudioContext.state === 'closed') {
        playbackAudioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
      }
      
      try {
        // Decode base64 to bytes
        const binaryString = atob(base64Audio);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        
        // Convert bytes to Int16Array (PCM 16-bit)
        const int16Data = new Int16Array(bytes.buffer);
        
        // Convert Int16 to Float32 for Web Audio API
        const float32Data = new Float32Array(int16Data.length);
        for (let i = 0; i < int16Data.length; i++) {
          float32Data[i] = int16Data[i] / 32768.0; // Normalize to -1.0 to 1.0
        }
        
        // Create audio buffer
        const audioBuffer = playbackAudioContext.createBuffer(1, float32Data.length, SAMPLE_RATE);
        audioBuffer.getChannelData(0).set(float32Data);
        
        // Play it
        const source = playbackAudioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playbackAudioContext.destination);
        source.start();
        
        console.log(`🔊 Playing audio chunk: ${float32Data.length} samples`);
        
        return new Promise(resolve => {
          source.onended = resolve;
        });
      } catch (e) {
        console.error('Audio playback error:', e);
        return Promise.resolve(); // Don't break the queue
      }
    }

    async function processAudioQueue() {
      if (isPlaying || audioQueue.length === 0) return;
      
      isPlaying = true;
      while (audioQueue.length > 0) {
        const chunk = audioQueue.shift();
        await playPcmAudio(chunk);
      }
      isPlaying = false;
    }

    // Listen for audio from Eleven Labs
    window.copilotTasks.onVoiceAudio((data) => {
      if (data.audio) {
        audioQueue.push(data.audio);
        processAudioQueue();
      }
    });

    // Listen for transcript updates
    window.copilotTasks.onVoiceTranscript((entry) => {
      const transcriptDiv = document.getElementById('transcript');
      const entryDiv = document.createElement('div');
      entryDiv.className = `transcript-entry ${entry.role}`;
      entryDiv.textContent = `${entry.role === 'agent' ? '🤖' : '👤'} ${entry.text}`;
      transcriptDiv.appendChild(entryDiv);
      transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
    });

    // Listen for call complete
    window.copilotTasks.onVoiceComplete((data) => {
      console.log('Voice call complete:', data);
      console.log('Summary:', data.summary);
      console.log('Transcript:', data.transcript);
      console.log('Duration:', data.duration);
      console.log('End reason:', data.endReason);
      
      // Auto-end the call
      if (currentCall) {
        stopMicrophoneCapture();
        stopAudioPlayback();
        const result = {
          summary: data.summary || 'Call completed',
          duration: data.duration || (callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0),
          transcript: data.transcript || [],
        };
        window.copilotTasks.endCall(currentCall.callId, result);
        if (durationInterval) clearInterval(durationInterval);
      }
    });
  </script>
</body>
