<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Tasks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      border: 1px solid #30363d;
      border-radius: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      border-radius: 12px 12px 0 0;
      -webkit-app-region: drag;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copilot-logo {
      width: 24px;
      height: 24px;
      color: #2f81f7;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .header-badge {
      margin-left: 6px;
      padding: 2px 8px;
      background: rgba(47, 129, 247, 0.15);
      border-radius: 12px;
      font-size: 11px;
      color: #2f81f7;
      font-weight: 500;
    }

    .new-request-btn {
      -webkit-app-region: no-drag;
      background: #238636;
      border: 1px solid #238636;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .new-request-btn:hover {
      background: #2ea043;
    }

    .new-request-btn:active {
      transform: scale(0.98);
    }

    .new-request-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Sections */
    .sections {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-app-region: no-drag;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
    }

    .section-badge {
      background: #30363d;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #8b949e;
    }

    /* Cards */
    .card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .card:hover {
      background: #262c36;
      border-color: #3d444d;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #e6edf3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-repo {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }

    .card-activity {
      font-size: 13px;
      color: #c9d1d9;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-users {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #8b949e;
      border: 2px solid #161b22;
      margin-left: -6px;
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .card-time {
      font-size: 11px;
      color: #8b949e;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-jump {
      background: transparent;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-jump:hover {
      background: rgba(88, 166, 255, 0.1);
      border-color: #58a6ff;
    }

    /* Status indicators */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-running {
      background: rgba(47, 129, 247, 0.15);
      color: #58a6ff;
    }

    .status-active {
      background: rgba(35, 134, 54, 0.15);
      color: #3fb950;
    }

    .status-idle {
      background: rgba(210, 153, 34, 0.15);
      color: #d29922;
    }

    .status-disconnected {
      background: rgba(139, 148, 158, 0.15);
      color: #8b949e;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-running .status-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-active .status-dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Queue card */
    .queue-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    .queue-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(47, 129, 247, 0.15);
      border: 1px solid rgba(47, 129, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #58a6ff;
    }

    .queue-icon svg {
      width: 18px;
      height: 18px;
    }

    .queue-info {
      flex: 1;
    }

    .queue-topic {
      font-size: 14px;
      font-weight: 500;
      color: #e6edf3;
    }

    .queue-context {
      font-size: 12px;
      color: #8b949e;
      margin-top: 2px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #8b949e;
    }

    .empty-icon {
      margin-bottom: 12px;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: #30363d;
    }

    .empty-text {
      font-size: 13px;
      color: #8b949e;
    }

    /* Branch tag */
    .branch-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(47, 129, 247, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #58a6ff;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
    }

    /* Scrollbar */
    .sections::-webkit-scrollbar {
      width: 8px;
    }

    .sections::-webkit-scrollbar-track {
      background: transparent;
    }

    .sections::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    .sections::-webkit-scrollbar-thumb:hover {
      background: #3d444d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <svg class="copilot-logo" viewBox="0 0 32 32" fill="currentColor">
          <rect x="4" y="10" width="24" height="16" rx="4" ry="4"/>
          <circle cx="12" cy="18" r="3" fill="#0d1117"/>
          <circle cx="20" cy="18" r="3" fill="#0d1117"/>
        </svg>
        <span class="title">Copilot Tasks</span>
        <span class="header-badge">Dashboard</span>
      </div>
      <button class="new-request-btn" id="newRequestBtn">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M7.75 2a.75.75 0 01.75.75V7h4.25a.75.75 0 110 1.5H8.5v4.25a.75.75 0 11-1.5 0V8.5H2.75a.75.75 0 010-1.5H7V2.75A.75.75 0 017.75 2z"/>
        </svg>
        New Request
      </button>
    </div>

    <div class="sections">
      <!-- Call Queue Section -->
      <div class="section" id="queueSection">
        <div class="section-header">
          <span class="section-title">Call Queue</span>
          <span class="section-badge" id="queueBadge">0</span>
        </div>
        <div id="queueList">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No pending calls</div>
          </div>
        </div>
      </div>

      <!-- Sessions Section -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Sessions</span>
          <span class="section-badge" id="sessionsBadge">0</span>
        </div>
        <div id="sessionsList">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No active sessions</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Time formatting
    function formatTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${days}d ago`;
    }

    // Get initials from name
    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    // Render queue
    function renderQueue(queue) {
      const queueList = document.getElementById('queueList');
      const queueBadge = document.getElementById('queueBadge');
      
      queueBadge.textContent = queue.length;

      if (queue.length === 0) {
        queueList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No pending calls</div>
          </div>
        `;
        return;
      }

      queueList.innerHTML = queue.map(call => `
        <div class="card queue-card" data-call-id="${call.callId}">
          <div class="queue-icon">
            <svg viewBox="0 0 32 32" fill="currentColor">
              <rect x="4" y="10" width="24" height="16" rx="4" ry="4"/>
              <circle cx="12" cy="18" r="3" fill="#0d1117"/>
              <circle cx="20" cy="18" r="3" fill="#0d1117"/>
            </svg>
          </div>
          <div class="queue-info">
            <div class="queue-topic">${escapeHtml(call.topic)}</div>
            <div class="queue-context">${escapeHtml(call.context || 'Waiting...')}</div>
          </div>
          <div class="card-time">${formatTime(call.timestamp)}</div>
        </div>
      `).join('');
    }

    // Render sessions
    function renderSessions(sessions) {
      const sessionsList = document.getElementById('sessionsList');
      const sessionsBadge = document.getElementById('sessionsBadge');
      
      sessionsBadge.textContent = sessions.length;

      if (sessions.length === 0) {
        sessionsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No active sessions</div>
          </div>
        `;
        return;
      }

      sessionsList.innerHTML = sessions.map(session => `
        <div class="card" data-session-id="${session.id}" data-tty="${session.tty || ''}">
          <div class="card-header">
            <div>
              <div class="card-title">
                ${escapeHtml(session.cwd ? session.cwd.split('/').pop() : session.repository)}
              </div>
              <div class="card-repo">
                ${session.cwd ? `<span class="branch-tag" title="${escapeHtml(session.cwd)}">${escapeHtml(session.cwd)}</span>` : `<span class="branch-tag"><svg style="width:10px;height:10px;margin-right:3px" viewBox="0 0 16 16" fill="currentColor"><path d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.492 2.492 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"/></svg>${escapeHtml(session.branch)}</span>`}
              </div>
            </div>
            <div class="status status-${session.status}">
              <span class="status-dot"></span>
              ${session.status.charAt(0).toUpperCase() + session.status.slice(1)}
            </div>
          </div>
          <div class="card-activity">${escapeHtml(session.lastActivity)}</div>
          <div class="card-meta">
            <div class="card-users">
              ${session.connectedUsers.map(user => `
                <div class="avatar" title="${escapeHtml(user)}">${getInitials(user)}</div>
              `).join('')}
            </div>
            <div class="card-time">${formatTime(session.lastActivityTime)}</div>
          </div>
          ${session.canJoin ? `
            <div class="card-actions">
              <button class="btn-jump" onclick="jumpIntoSession('${session.id}', '${session.tty || ''}')">${session.status === 'running' ? 'Focus →' : 'Jump In →'}</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Jump into session
    async function jumpIntoSession(sessionId, tty) {
      await window.dashboard.jumpIntoSession(sessionId, tty || null);
    }

    // New request button
    document.getElementById('newRequestBtn').addEventListener('click', async () => {
      await window.dashboard.newRequest();
    });

    // Load dashboard data
    async function loadData() {
      try {
        const data = await window.dashboard.getData();
        renderQueue(data.queue || []);
        renderSessions(data.sessions || []);
      } catch (error) {
        console.error('Failed to load dashboard data:', error);
      }
    }

    // Initial load
    loadData();

    // Refresh periodically
    setInterval(loadData, 5000);
  </script>
</body>
</html>
