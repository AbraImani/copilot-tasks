<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Tasks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      border: 1px solid #30363d;
      border-radius: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      border-radius: 12px 12px 0 0;
      -webkit-app-region: drag;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copilot-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .header-badge {
      margin-left: 6px;
      padding: 2px 8px;
      background: rgba(47, 129, 247, 0.15);
      border-radius: 12px;
      font-size: 11px;
      color: #2f81f7;
      font-weight: 500;
    }

    .new-request-btn {
      -webkit-app-region: no-drag;
      background: #238636;
      border: 1px solid #238636;
      color: white;
      padding: 6px 10px;
      border-radius: 6px 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0;
      transition: all 0.15s ease;
    }

    .new-request-btn:hover {
      background: #2ea043;
    }

    .new-request-btn:active {
      transform: scale(0.98);
    }

    .new-request-btn svg {
      width: 18px;
      height: 18px;
    }

    .split-btn-group {
      -webkit-app-region: no-drag;
      display: flex;
      position: relative;
    }

    .split-btn-dropdown {
      background: #238636;
      border: 1px solid #238636;
      border-left: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 8px;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    .split-btn-dropdown:hover {
      background: #2ea043;
    }

    .split-btn-dropdown svg {
      width: 12px;
      height: 12px;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      min-width: 160px;
      z-index: 100;
      display: none;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: #e6edf3;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .dropdown-item:hover {
      background: #30363d;
    }

    .dropdown-item:first-child {
      border-radius: 6px 6px 0 0;
    }

    .dropdown-item:last-child {
      border-radius: 0 0 6px 6px;
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
      color: #8b949e;
    }

    .dropdown-item:hover svg {
      color: #e6edf3;
    }

    /* Sections */
    .sections {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-app-region: no-drag;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
    }

    .section-badge {
      background: #30363d;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      color: #8b949e;
    }

    /* Session rows */
    .session-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .session-row:hover {
      background: #262c36;
      border-color: #3d444d;
    }

    .session-row:last-child {
      margin-bottom: 0;
    }

    .session-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .session-icon svg {
      width: 14px;
      height: 14px;
      color: #8b949e;
    }

    .session-icon.running {
      background: rgba(47, 129, 247, 0.15);
    }

    .session-icon.running svg {
      color: #58a6ff;
    }

    .session-icon.active {
      background: rgba(35, 134, 54, 0.15);
    }

    .session-icon.active svg {
      color: #3fb950;
    }

    .session-info {
      flex: 1;
      min-width: 0;
    }

    .session-name {
      font-size: 13px;
      font-weight: 500;
      color: #e6edf3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-detail {
      font-size: 11px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 10px;
      color: #8b949e;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
    }

    .status-badge.running {
      background: rgba(47, 129, 247, 0.15);
      color: #58a6ff;
    }

    .status-badge.active {
      background: rgba(35, 134, 54, 0.15);
      color: #3fb950;
    }

    .status-badge.idle {
      background: rgba(210, 153, 34, 0.15);
      color: #d29922;
    }

    .status-badge.disconnected {
      background: rgba(139, 148, 158, 0.1);
      color: #8b949e;
    }

    .status-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.running .dot,
    .status-badge.active .dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .session-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .session-row:hover .session-actions {
      opacity: 1;
    }

    .session-action-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      padding: 0;
    }

    .session-action-btn:hover {
      background: rgba(88, 166, 255, 0.1);
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .session-action-btn svg {
      width: 12px;
      height: 12px;
    }

    .source-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 500;
      background: rgba(139, 148, 158, 0.1);
      color: #8b949e;
    }

    .source-badge.process {
      background: rgba(210, 153, 34, 0.1);
      color: #d29922;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-action:hover {
      background: rgba(88, 166, 255, 0.1);
      border-color: #58a6ff;
    }

    /* Queue card */
    .queue-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
    }

    .queue-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(47, 129, 247, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #58a6ff;
      flex-shrink: 0;
    }

    .queue-icon svg {
      width: 14px;
      height: 14px;
    }

    .queue-info {
      flex: 1;
      min-width: 0;
    }

    .queue-topic {
      font-size: 13px;
      font-weight: 500;
      color: #e6edf3;
    }

    .queue-context {
      font-size: 11px;
      color: #8b949e;
      margin-top: 1px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 20px 16px;
      color: #8b949e;
    }

    .empty-icon {
      margin-bottom: 8px;
    }

    .empty-icon svg {
      width: 32px;
      height: 32px;
      color: #30363d;
    }

    .empty-text {
      font-size: 12px;
      color: #8b949e;
    }

    /* Branch tag */
    .branch-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(47, 129, 247, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #58a6ff;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
    }

    /* Scrollbar */
    .sections::-webkit-scrollbar {
      width: 8px;
    }

    .sections::-webkit-scrollbar-track {
      background: transparent;
    }

    .sections::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    .sections::-webkit-scrollbar-thumb:hover {
      background: #3d444d;
    }
  </style>
</head>

                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No pending calls</div>
          </div>
        </div>
      </div>

      <!-- Sessions Section -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Sessions</span>
          <span class="section-badge" id="sessionsBadge">0</span>
        </div>
        <div id="sessionsList">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No active sessions</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Time formatting
    function formatTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${days}d ago`;
    }

    // Get initials from name
    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    // Render queue
    function renderQueue(queue) {
      const queueList = document.getElementById('queueList');
      const queueBadge = document.getElementById('queueBadge');
      
      queueBadge.textContent = queue.length;

      if (queue.length === 0) {
        queueList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No pending calls</div>
          </div>
        `;
        return;
      }

      queueList.innerHTML = queue.map(call => `
        <div class="session-row" data-call-id="${call.callId}">
          <div class="queue-icon">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M3.654 1.328a.678.678 0 00-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 004.168 6.608 17.569 17.569 0 006.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 00-.063-1.015l-2.307-1.794a.678.678 0 00-.58-.122l-2.19.547a1.745 1.745 0 01-1.657-.459L5.482 8.062a1.745 1.745 0 01-.46-1.657l.548-2.19a.678.678 0 00-.122-.58L3.654 1.328z"/>
            </svg>
          </div>
          <div class="session-info">
            <div class="session-name">${escapeHtml(call.topic)}</div>
            <div class="session-detail">${escapeHtml(call.context || 'Waiting...')}</div>
          </div>
          <span class="session-time">${formatTime(call.timestamp)}</span>
        </div>
      `).join('');
    }

    // Render sessions
    function renderSessions(sessions) {
      const sessionsList = document.getElementById('sessionsList');
      const sessionsBadge = document.getElementById('sessionsBadge');
      
      sessionsBadge.textContent = sessions.length;

      if (sessions.length === 0) {
        sessionsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <div class="empty-text">No active sessions</div>
          </div>
        `;
        return;
      }

      sessionsList.innerHTML = sessions.map(session => {
        const name = session.cwd ? session.cwd.split('/').pop() : session.repository;
        const detail = session.lastActivity.length > 50 ? session.lastActivity.substring(0, 47) + '...' : session.lastActivity;
        const isProcessOnly = session.source === 'process';
        const sourceBadge = isProcessOnly
          ? '<span class="source-badge process">Terminal</span>'
          : '';

        // Chat button (for sdk/both sessions)
        const chatBtn = session.canChat ? `
          <button class="session-action-btn" title="Open Chat" onclick="event.stopPropagation(); jumpIntoSession('${session.id}', '')">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M1.5 2.75a.25.25 0 0 1 .25-.25h12.5a.25.25 0 0 1 .25.25v8.5a.25.25 0 0 1-.25.25h-6.5a.75.75 0 0 0-.53.22L4.5 14.44v-2.19a.75.75 0 0 0-.75-.75h-2a.25.25 0 0 1-.25-.25Zm.25-1.75A1.75 1.75 0 0 0 0 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 0 0 2.487 1.03L8.061 13h6.189A1.75 1.75 0 0 0 16 11.25v-8.5A1.75 1.75 0 0 0 14.25 1Z"/>
            </svg>
          </button>
        ` : '';

        // Terminal button (for sdk/both sessions, or focus for process)
        const termBtn = session.canOpenTerminal ? `
          <button class="session-action-btn" title="Open in Terminal" onclick="event.stopPropagation(); openInTerminal('${session.id}')">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM7.25 8a.749.749 0 0 1-.22.53l-2.25 2.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L5.44 8 3.72 6.28a.749.749 0 1 1 1.06-1.06l2.25 2.25c.141.14.22.331.22.53Zm1.5 1.5h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5Z"/>
            </svg>
          </button>
        ` : '';

        // Focus button (only for process-only sessions with a tty)
        const focusBtn = isProcessOnly && session.tty ? `
          <button class="session-action-btn" title="Focus Terminal" onclick="event.stopPropagation(); jumpIntoSession('${session.id}', '${session.tty}')">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
        ` : '';

        // Default click: chat for SDK sessions, focus for process
        const rowClick = isProcessOnly && session.tty
          ? `onclick="jumpIntoSession('${session.id}', '${session.tty}')"` 
          : session.canChat
          ? `onclick="jumpIntoSession('${session.id}', '')"` 
          : '';
        
        return `
          <div class="session-row" data-session-id="${session.id}" ${rowClick}>
            <div class="session-icon ${session.status}">
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25zm1.75-.25a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V2.75a.25.25 0 00-.25-.25zM3.5 6.25a.75.75 0 01.75-.75h7a.75.75 0 010 1.5h-7a.75.75 0 01-.75-.75zm.75 2.25a.75.75 0 000 1.5h4a.75.75 0 000-1.5z"/>
              </svg>
            </div>
            <div class="session-info">
              <div class="session-name">${escapeHtml(name)} ${sourceBadge}</div>
              <div class="session-detail">${escapeHtml(detail)}</div>
            </div>
            <div class="session-actions">
              ${chatBtn}${termBtn}${focusBtn}
            </div>
            <div class="session-meta">
              <span class="session-time">${formatTime(session.lastActivityTime)}</span>
              <div class="status-badge ${session.status}">
                <span class="dot"></span>
                ${session.status.charAt(0).toUpperCase() + session.status.slice(1)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Jump into session
    async function jumpIntoSession(sessionId, tty) {
      await window.dashboard.jumpIntoSession(sessionId, tty || null);
    }

    // Open session in terminal
    async function openInTerminal(sessionId) {
      await window.dashboard.openInTerminal(sessionId);
    }

    // Dropdown handling
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    
    dropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
    });

    // New request button (chat)
    document.getElementById('newRequestBtn').addEventListener('click', async () => {
      await window.dashboard.newChatRequest();
    });

    // Voice request button
    document.getElementById('voiceRequestBtn').addEventListener('click', async () => {
      dropdownMenu.classList.remove('show');
      await window.dashboard.newVoiceRequest();
    });

    // Load dashboard data
    async function loadData() {
      try {
        const data = await window.dashboard.getData();
        renderQueue(data.queue || []);
        renderSessions(data.sessions || []);
      } catch (error) {
        console.error('Failed to load dashboard data:', error);
      }
    }

    // Initial load
    loadData();

    // Refresh periodically
    setInterval(loadData, 5000);
  </script>
</body>
</html>
